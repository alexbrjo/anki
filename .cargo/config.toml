[env]
STRINGS_PY = { value = "out/pylib/anki/_fluent.py", relative = true }
STRINGS_TS = { value = "out/ts/lib/generated/ftl.ts", relative = true }
DESCRIPTORS_BIN = { value = "out/rslib/proto/descriptors.bin", relative = true }
# build script will append .exe if necessary
PROTOC = { value = "out/extracted/protoc/bin/protoc", relative = true }
PYO3_NO_PYTHON = "1"
MACOSX_DEPLOYMENT_TARGET = "11"
PYTHONDONTWRITEBYTECODE = "1" # prevent junk files on Windows

# Redirect libsqlite3-sys at our vendored libdoltlite.a (renamed to libsqlite3.a
# via symlink so the linker finds it under the expected name). Doltlite is a
# drop-in for SQLite at the C ABI, so no FFI changes needed. The include/ dir
# is kept separate from lib/ so libsqlite3-sys doesn't try to re-compile the
# amalgamation source — we want the prolly engine baked into libdoltlite.a,
# which the SQLite-compat amalgamation doesn't provide.
SQLITE3_LIB_DIR = { value = "rslib/doltlite-sys/lib", relative = true }
SQLITE3_INCLUDE_DIR = { value = "rslib/doltlite-sys/include", relative = true }
SQLITE3_STATIC = "1"

[term]
color = "always"

[target.'cfg(all(target_env = "msvc", target_os = "windows"))']
rustflags = ["-C", "target-feature=+crt-static"]
