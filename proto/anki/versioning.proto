syntax = "proto3";

option java_multiple_files = true;

package anki.versioning;

import "anki/collection.proto";

service VersioningService {
  // Snapshot a note's current content under this session id. The matching
  // CommitSession will compare the note's content against this snapshot
  // and skip the commit if nothing actually changed.
  rpc BeginSession(BeginSessionRequest) returns (BeginSessionResponse);

  // Record that the given note was just added (i.e. did not exist before
  // this session). Equivalent to BeginSession but with a `prior=None`
  // snapshot, so the next CommitSession sees None -> Some(current) and
  // stamps a commit. Used by the Add Cards flow, which has no row to
  // snapshot before add_note runs.
  rpc MarkNoteAdded(MarkNoteAddedRequest) returns (MarkNoteAddedResponse);

  // Stamp a commit if the session's snapshotted note actually differs
  // from its current state. Returns the new commit hash, or empty if
  // nothing was committed.
  rpc CommitSession(CommitSessionRequest) returns (CommitSessionResponse);

  // List prior versions of a single note, newest first. Each entry is one
  // Doltlite commit that touched the note's row.
  rpc ListNoteVersions(NoteVersionsRequest) returns (NoteVersionsResponse);

  // Replace the current note with its content at the given commit, and
  // stamp the revert as a new commit. Append-only: in-between versions
  // remain in history.
  rpc RestoreNoteVersion(RestoreNoteVersionRequest)
      returns (RestoreNoteVersionResponse);

  // Read a note's fields & tags at a specific commit, without mutating
  // anything. Used by the editor's version sidebar to preview an old
  // version inline before the user decides to revert.
  rpc GetNoteAtVersion(GetNoteAtVersionRequest)
      returns (GetNoteAtVersionResponse);
}

service BackendVersioningService {}

enum SessionKind {
  SESSION_KIND_EDITOR = 0;
  SESSION_KIND_AGENT = 1;
  SESSION_KIND_APP = 2;
}

message BeginSessionRequest {
  string session_id = 1;
  int64 nid = 2;
}

message BeginSessionResponse {}

message MarkNoteAddedRequest {
  string session_id = 1;
  int64 nid = 2;
}

message MarkNoteAddedResponse {}

message CommitSessionRequest {
  // 32-char hex id generated by the caller at session start.
  string session_id = 1;
  SessionKind kind = 2;
  // Backend derives the final committer from `kind` + `actor_name`:
  //   Editor → "user"               (actor_name ignored)
  //   Agent  → "agent:<actor_name>" (actor_name required, non-empty)
  //   App    → "app:<actor_name>"   (actor_name required, non-empty)
  // This is what stops a client from masquerading as another kind.
  string actor_name = 3;
}

message CommitSessionResponse {
  // Empty string if no commit was made (notes table was clean).
  string commit_hash = 1;
}

message NoteVersionsRequest {
  int64 nid = 1;
}

message NoteVersionsResponse {
  repeated NoteVersion versions = 1;
}

message NoteVersion {
  string commit_hash = 1;
  // Unix epoch seconds parsed from dolt_log.date (UTC, second resolution).
  int64 timestamp_secs = 2;
  // dolt_log.committer — "human" or "agent:<name>".
  string author = 3;
  // Parsed out of the JSON commit message. Empty if not present (e.g. the
  // repo-init commit).
  string session_id = 4;
  string session_kind = 5;
  // Names of fields that differ from the prior version of this note. Empty
  // for the oldest version (no prior to diff against). Resolved against the
  // newest version's notetype — if the notetype was changed across versions,
  // names reflect the current schema.
  repeated string changed_fields = 6;
}

message RestoreNoteVersionRequest {
  int64 nid = 1;
  string commit_hash = 2;
  // Session metadata for the new revert commit. The client picks a fresh
  // session id and author the same way it does for ordinary edits.
  string session_id = 3;
  SessionKind kind = 4;
  // Same derivation rules as CommitSessionRequest.actor_name.
  string actor_name = 5;
}

message GetNoteAtVersionRequest {
  int64 nid = 1;
  string commit_hash = 2;
}

message GetNoteAtVersionResponse {
  // Field values in note-type order, same separator semantics as Note.fields.
  repeated string fields = 1;
  // Tag names (split on whitespace, same as Note.tags).
  repeated string tags = 2;
}

message RestoreNoteVersionResponse {
  // Hash of the new revert commit. Empty if the historical content already
  // matched the current state.
  string commit_hash = 1;
  // OpChanges from the underlying update_note so callers can wrap this RPC
  // in a CollectionOp and have the reviewer / browser / editors refresh.
  collection.OpChanges changes = 2;
}
